[project]
name = "acpf-bot"
version = "1.0.0"
description = "ACPF Telegram Bot - Bilingual funnel for beauty industry programs"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "email-validator>=2.0.0",
    "ruff>=0.14.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
